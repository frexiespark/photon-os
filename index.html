<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>illusionary // standby</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --white:#ffffff;
    --blue-900: hsl(240,100%,14%);
    --blue-700: hsl(240,90%,32%);
    --blue-600: hsl(240,92%,45%);
    --blue-500: hsl(240,100%,55%);
    --peri-300: hsl(240,100%,86%);
    --peri-200: hsl(240,100%,93%);
    --peri-100: hsl(240,100%,97%);
    --peri-400: hsl(240,85%,78%);
    --pure-blue: hsl(240,100%,50%);
    --app-bg: #eeeeff;
    --line: hsl(240,100%,45%);
  }

  *{box-sizing:border-box;}

  html,body{
    height:100%;
    margin:0;
    background:var(--white);
    font-family:'JetBrains Mono', monospace;
    color:var(--blue-600);
    overflow:hidden;
    -webkit-tap-highlight-color:transparent;
  }
  body{
    display:flex;
    flex-direction:column;
  }

  /* ---------- background layers ---------- */

  .bg-layer{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
  }

  #circuitSvg{ opacity:1; }
  #washLayer{ display:none; }
  #dotLayer{
    background-image: radial-gradient(circle, var(--blue-600) 1.8px, transparent 1.9px);
    background-size: 26px 26px;
    opacity:0.5;
  }
  #circuitSvg .pipe-outline rect{
    stroke: var(--blue-600);
    stroke-width:9;
    fill:none;
  }
  #circuitSvg .pipe-fill rect{
    stroke: var(--white);
    stroke-width:5;
    fill:none;
  }

  .dot{
    position:fixed;
    border-radius:50%;
    background:var(--blue-600);
    z-index:0;
    pointer-events:none;
    animation-name: dotfade;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
  }
  @keyframes dotfade{
    0%,100%{ opacity:0.05; }
    50%{ opacity:0.4; }
  }

  .wash-block{
    position:fixed;
    background:var(--peri-200);
    opacity:0.35;
    z-index:0;
    pointer-events:none;
  }

  /* ---------- screen shell ---------- */

  .screen{
    position:relative;
    z-index:2;
    flex:1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding: 7vh 6vw 0 6vw;
    text-align:center;
  }

  header{
    width:100%;
    max-width:520px;
  }
  header h1{
    margin:0 0 10px 0;
    font-size:clamp(18px, 4vw, 26px);
    font-weight:700;
    letter-spacing:0.5px;
  }
  header .rule{
    height:4px;
    background:var(--blue-600);
    width:100%;
    border-radius:2px;
  }

  .clock-panel{
    position:relative;
    margin-top:8vh;
    width:100%;
    max-width:520px;
    background:var(--peri-200);
    border:4px solid var(--pure-blue);
    border-radius:18px;
    padding: 30px 20px 34px 20px;
    overflow:hidden;
  }
  .time{
    position:relative;
    font-size:clamp(48px, 15vw, 92px);
    font-weight:800;
    letter-spacing:-2px;
    line-height:1;
    color:var(--blue-600);
  }
  .date{
    position:relative;
    margin-top:10px;
    font-size:clamp(13px, 3.4vw, 17px);
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--blue-700);
    text-transform:lowercase;
  }

  .quote{
    margin-top:6vh;
    max-width:420px;
    width:100%;
    background:var(--peri-200);
    border:3px solid var(--pure-blue);
    border-radius:14px;
    padding: 14px 18px;
    font-size:clamp(12px, 3vw, 15px);
    font-weight:600;
    color:var(--blue-600);
    min-height:1.4em;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: opacity .5s ease;
  }
  .quote::before{ content:"[ "; }
  .quote::after{ content:" ]"; }

  .spacer{ flex:1 1 auto; }

  .drawer-toggle{
    background:none;
    border:none;
    color:var(--blue-600);
    font-size:26px;
    font-weight:800;
    line-height:1;
    padding: 10px;
    cursor:pointer;
    transition: transform .3s ease;
  }
  .drawer-toggle.open{ transform: rotate(180deg); }

  .dock-bar{
    position:relative;
    z-index:2;
    width:100%;
    background: hsl(240, 65%, 88%);
    border-top:3px solid var(--blue-600);
    padding:14px 0;
    font-size:13px;
    font-weight:600;
    letter-spacing:0.5px;
    color:var(--blue-700);
    text-transform:lowercase;
    cursor:pointer;
    text-align:center;
  }

  /* ---------- drawer ---------- */

  .drawer{
    position:fixed;
    left:0; right:0; bottom:0;
    z-index:5;
    background: hsl(240, 65%, 88%);
    border-top:4px solid var(--blue-600);
    transition: transform .35s ease;
    max-height:70vh;
    display:flex;
    flex-direction:column;
  }
  .drawer.open{ transform: translateY(0); }

  .drawer-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 20px 6px 20px;
  }
  .drawer-head span{
    font-size:13px;
    font-weight:700;
    letter-spacing:0.5px;
    color:var(--blue-700);
    text-transform:lowercase;
  }
  .drawer-close{
    background:none;
    border:none;
    color:var(--blue-600);
    font-size:20px;
    font-weight:800;
    cursor:pointer;
    padding:4px 10px;
  }

  .app-grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(84px, 1fr));
    gap:18px;
    padding: 10px 24px 28px 24px;
    overflow-y:auto;
  }

  .app-tile{
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    color:var(--blue-700);
    font-family:inherit;
  }
  .app-tile .icon{
    width:56px;
    height:56px;
    border-radius:16px;
    background:var(--peri-200);
    border:2.5px solid var(--blue-600);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .app-tile.soon .icon{
    opacity:0.5;
    border-style:dashed;
  }
  .app-tile.soon{ opacity:0.6; }
  .app-tile .icon svg{ width:26px; height:26px; stroke:var(--blue-600); fill:none; stroke-width:2.4; }
  .app-tile .label{
    font-size:11px;
    font-weight:600;
    letter-spacing:0.3px;
    text-transform:lowercase;
  }

  /* ---------- notes app window ---------- */

  .app-window{
    position:fixed;
    inset:0;
    z-index:10;
    background:var(--app-bg);
    display:flex;
    flex-direction:column;
    transform: translateY(100%);
    transition: transform .32s ease;
    pointer-events:none;
  }
  .app-window.open{
    transform: translateY(0);
    pointer-events:auto;
  }

  .app-window-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 20px;
    border-bottom:3px solid var(--blue-600);
  }
  .app-window-head h2{
    margin:0;
    font-size:16px;
    font-weight:700;
    color:var(--blue-600);
    text-transform:lowercase;
  }
  .app-window-head button{
    background:none;
    border:2px solid var(--blue-600);
    color:var(--blue-600);
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    text-transform:lowercase;
  }
  .app-window-head .btns{ display:flex; gap:8px; }

  #notesArea{
    flex:1;
    border:none;
    outline:none;
    resize:none;
    padding:20px 24px;
    font-family:'JetBrains Mono', monospace;
    font-size:15px;
    color:var(--blue-900);
    line-height:1.6;
  }
  #notesArea::placeholder{ color:var(--peri-300); }

  .save-status{
    padding:8px 24px 16px 24px;
    font-size:11px;
    color:var(--blue-700);
    opacity:0.75;
    text-transform:lowercase;
  }

  .file-list{
    flex:1;
    overflow-y:auto;
    padding: 6px 12px 20px 12px;
  }
  .file-list-empty{
    padding:40px 20px;
    text-align:center;
    color:var(--peri-300);
    font-size:13px;
  }
  .file-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:14px 12px;
    border-bottom:2px solid var(--peri-200);
    cursor:pointer;
  }
  .file-row .file-icon{
    width:34px; height:34px;
    flex:none;
    border-radius:8px;
    border:2px solid var(--blue-600);
    background:var(--peri-100);
    display:flex; align-items:center; justify-content:center;
  }
  .file-row .file-icon svg{ width:16px; height:16px; stroke:var(--blue-600); fill:none; stroke-width:2.4; }
  .file-row .file-meta{
    flex:1;
    min-width:0;
    text-align:left;
  }
  .file-row .file-name{
    font-size:14px;
    font-weight:700;
    color:var(--blue-700);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .file-row .file-updated{
    font-size:10px;
    color:var(--blue-600);
    opacity:0.6;
    margin-top:2px;
  }
  .file-row .file-delete{
    flex:none;
    background:none;
    border:none;
    color:var(--blue-700);
    opacity:0.5;
    font-size:16px;
    font-weight:800;
    cursor:pointer;
    padding:6px 8px;
  }
  .file-row .file-delete:hover{ opacity:1; }

  .new-file-bar{
    display:flex;
    gap:8px;
    padding:12px 20px;
    border-bottom:3px solid var(--peri-200);
  }
  .new-file-bar input{
    flex:1;
    border:2px solid var(--peri-300);
    border-radius:8px;
    padding:8px 10px;
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--blue-900);
    outline:none;
  }
  .new-file-bar input:focus{ border-color:var(--blue-600); }
  .new-file-bar button{
    flex:none;
    background:var(--blue-600);
    border:2px solid var(--blue-600);
    color:var(--white);
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:8px 14px;
    border-radius:8px;
    cursor:pointer;
    text-transform:lowercase;
  }

  .calc-display{
    padding: 26px 24px 14px 24px;
    text-align:right;
  }
  .calc-display .calc-prev{
    font-size:13px;
    color:var(--blue-700);
    opacity:0.6;
    min-height:1.2em;
  }
  .calc-display .calc-current{
    font-size:clamp(32px, 10vw, 46px);
    font-weight:800;
    color:var(--blue-600);
    word-break:break-all;
  }
  .calc-grid{
    flex:1;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-auto-rows: 1fr;
    gap:10px;
    padding: 10px 20px 24px 20px;
  }
  .calc-grid-5{ grid-template-columns: repeat(5, 1fr); }
  .calc-btn{
    border:2.5px solid var(--blue-600);
    border-radius:14px;
    background:var(--peri-100);
    color:var(--blue-600);
    font-family:'JetBrains Mono', monospace;
    font-size:19px;
    font-weight:700;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .calc-grid-5 .calc-btn{ font-size:15px; }
  .calc-btn:active{ background:var(--peri-300); }
  .calc-btn.op{ background:var(--blue-600); color:var(--white); }
  .calc-btn.op:active{ background:var(--blue-700); }
  .calc-btn.wide{ grid-column: span 2; }

  .tw-tabs{
    display:flex;
    gap:8px;
    padding:16px 20px 0 20px;
  }
  .tw-tab{
    flex:1;
    background:var(--peri-100);
    border:2.5px solid var(--blue-600);
    border-radius:10px;
    color:var(--blue-700);
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:10px 0;
    cursor:pointer;
    text-transform:lowercase;
  }
  .tw-tab.active{ background:var(--blue-600); color:var(--white); }

  .tw-pane[hidden]{ display:none; }
  .tw-pane{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 20px 24px 30px 24px;
    gap:24px;
  }
  .tw-display{
    font-size:clamp(40px, 13vw, 64px);
    font-weight:800;
    color:var(--blue-600);
    letter-spacing:1px;
  }
  .tw-sub{
    font-size:12px;
    color:var(--blue-700);
    opacity:0.7;
    text-transform:lowercase;
    min-height:1.4em;
  }
  .tw-controls{
    display:flex;
    gap:14px;
  }
  .tw-controls button{
    background:var(--peri-100);
    border:2.5px solid var(--blue-600);
    color:var(--blue-600);
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    padding:12px 22px;
    border-radius:12px;
    cursor:pointer;
    text-transform:lowercase;
  }
  .tw-controls button.primary{ background:var(--blue-600); color:var(--white); }

  .tw-set{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .tw-set input{
    width:64px;
    text-align:center;
    border:2px solid var(--peri-300);
    border-radius:8px;
    padding:10px 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:20px;
    font-weight:700;
    color:var(--blue-900);
    outline:none;
  }
  .tw-set input:focus{ border-color:var(--blue-600); }
  .tw-set span{ font-size:20px; font-weight:700; color:var(--blue-600); }

  .tw-laps{
    width:100%;
    max-height:120px;
    overflow-y:auto;
    font-size:12px;
    color:var(--blue-700);
  }
  .tw-laps div{ padding:4px 0; border-bottom:1px solid var(--peri-200); }

  .rng-display{
    font-size:clamp(48px, 16vw, 76px);
    font-weight:800;
    color:var(--blue-600);
  }
  .rng-inputs{
    display:flex;
    align-items:center;
    gap:10px;
  }
  .rng-inputs input{
    width:70px;
    text-align:center;
    border:2px solid var(--peri-300);
    border-radius:8px;
    padding:10px 6px;
    font-family:'JetBrains Mono', monospace;
    font-size:16px;
    font-weight:700;
    color:var(--blue-900);
    outline:none;
  }
  .rng-inputs input:focus{ border-color:var(--blue-600); }
  .rng-inputs span{ font-size:13px; color:var(--blue-700); text-transform:lowercase; }
  .rng-roll{
    background:var(--blue-600);
    border:2.5px solid var(--blue-600);
    color:var(--white);
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    padding:14px 30px;
    border-radius:12px;
    cursor:pointer;
    text-transform:lowercase;
  }
  .rng-presets{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    justify-content:center;
  }
  .rng-presets button{
    background:var(--peri-100);
    border:2px solid var(--blue-600);
    color:var(--blue-600);
    font-family:inherit;
    font-weight:700;
    font-size:12px;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    text-transform:lowercase;
  }

  /* ---------- games ---------- */

  .games-menu{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:16px;
    padding:26px 24px;
    justify-content:center;
  }
  .games-menu[hidden]{ display:none; }
  .game-tile{
    background:var(--peri-100);
    border:2.5px solid var(--blue-600);
    border-radius:14px;
    color:var(--blue-700);
    font-family:inherit;
    font-weight:700;
    font-size:15px;
    padding:20px;
    cursor:pointer;
    text-transform:lowercase;
    text-align:left;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .game-tile span.arrow{ font-size:18px; color:var(--blue-600); }

  .game-stage{
    flex:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding:10px 10px 20px 10px;
    gap:12px;
    overflow:hidden;
  }
  .game-stage[hidden]{ display:none; }

  .game-settings{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
    justify-content:center;
    width:100%;
    max-width:420px;
  }
  .game-settings select{
    background:var(--peri-100);
    border:2px solid var(--blue-600);
    border-radius:8px;
    color:var(--blue-700);
    font-family:inherit;
    font-weight:700;
    font-size:11px;
    padding:7px 8px;
    cursor:pointer;
    text-transform:lowercase;
  }

  .game-hud{
    display:flex;
    justify-content:space-between;
    align-items:center;
    width:100%;
    max-width:340px;
    font-size:13px;
    font-weight:700;
    color:var(--blue-700);
    text-transform:lowercase;
  }
  .game-hud button{
    background:var(--peri-100);
    border:2px solid var(--blue-600);
    color:var(--blue-600);
    font-family:inherit;
    font-weight:700;
    font-size:11px;
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    text-transform:lowercase;
  }

  .game-overlay{
    font-size:12px;
    font-weight:700;
    color:var(--blue-600);
    text-transform:lowercase;
    min-height:1.4em;
    text-align:center;
  }

  /* snake */
  #snakeCanvas{
    background:var(--white);
    border:3px solid var(--pure-blue);
    border-radius:10px;
    touch-action:none;
    width:min(88vw, 420px);
    height:min(88vw, 420px);
  }
  .dpad{
    display:grid;
    grid-template-columns: repeat(3, 44px);
    grid-template-rows: repeat(3, 44px);
    gap:6px;
  }
  .dpad button{
    background:var(--peri-100);
    border:2px solid var(--blue-600);
    border-radius:10px;
    color:var(--blue-600);
    font-size:16px;
    cursor:pointer;
  }
  .dpad button:nth-child(1){ grid-column:2; grid-row:1; }
  .dpad button:nth-child(2){ grid-column:1; grid-row:2; }
  .dpad button:nth-child(3){ grid-column:3; grid-row:2; }
  .dpad button:nth-child(4){ grid-column:2; grid-row:3; }

  /* 2048 */
  .g2048-board{
    display:block;
    position:relative;
    width:min(92vw, 420px);
    height:min(92vw, 420px);
    background:var(--peri-200);
    border:3px solid var(--pure-blue);
    border-radius:12px;
    touch-action:none;
  }
  .g2048-cells{
    position:absolute;
    inset:8px;
    display:grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 1fr);
    gap:8px;
  }
  .g2048-cell{
    background:var(--peri-100);
    border-radius:8px;
  }
  .g2048-tiles{
    position:absolute;
    inset:8px;
  }
  .g2048-tile-wrap{
    position:absolute;
    top:0; left:0;
    transition: transform 150ms ease;
  }
  .g2048-tile-inner{
    width:100%;
    height:100%;
    border-radius:8px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:clamp(14px, 5.5vw, 22px);
    color:var(--blue-900);
  }
  .g2048-tile-inner.pop{ animation: g2048pop 160ms ease; }
  @keyframes g2048pop{
    0%{ transform:scale(0.7); }
    60%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
  }

  /* minesweeper */
  .mine-board{
    display:grid;
    gap:3px;
    background:var(--pure-blue);
    border:3px solid var(--pure-blue);
    border-radius:8px;
    padding:3px;
  }
  .mine-cell{
    width:var(--cell, 30px); height:var(--cell, 30px);
    background:var(--peri-300);
    border-radius:3px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:calc(var(--cell, 30px) * 0.45);
    font-weight:800;
    color:var(--blue-700);
    cursor:pointer;
  }
  .mine-cell.revealed{ background:var(--app-bg); cursor:default; }
  .mine-cell.flagged{ background:var(--peri-400); }
  .mine-cell.mine{ background:var(--blue-600); color:var(--white); }

  .toast{
    position:fixed;
    bottom:90px;

    left:50%;
    transform:translateX(-50%) translateY(20px);
    background:var(--blue-600);
    color:var(--white);
    padding:10px 18px;
    border-radius:10px;
    font-size:12px;
    font-weight:600;
    z-index:20;
    opacity:0;
    pointer-events:none;
    transition: opacity .25s ease, transform .25s ease;

</style>

<script>
  // (background dot grid is handled via CSS on #dotLayer)

  // ---------- background wash blocks ----------
  const washLayer = document.getElementById('washLayer');
  const washRects = [
    {top:'5%', left:'10%', width:'55%', height:'28%'},
    {top:'40%', left:'-5%', width:'40%', height:'30%'},
    {top:'62%', left:'55%', width:'50%', height:'34%'},
  ];
  washRects.forEach(r=>{
    const b = document.createElement('div');
    b.className = 'wash-block';
    Object.assign(b.style, r);
    washLayer.appendChild(b);
  });

  // ---------- clock ----------
  const timeEl = document.getElementById('time');
  const dateEl = document.getElementById('date');
  const days = ['sunday','monday','tuesday','wednesday','thursday','friday','saturday'];
  const months = ['january','february','march','april','may','june','july','august','september','october','november','december'];

  function pad(n){ return n.toString().padStart(2,'0'); }

  function tick(){
    const now = new Date();
    timeEl.textContent = pad(now.getHours()) + ':' + pad(now.getMinutes());
    dateEl.textContent = `${months[now.getMonth()]} ${now.getDate()} ${now.getFullYear()} // ${days[now.getDay()]}`;
  }
  tick();
  setInterval(tick, 1000);

  // ---------- quotes ----------
  const quotes = [
    "still loading, please stand by",
    "chaotic good since day one",
    "current status: definitely fine",
    "running on vibes and caffeine",
    "circuit's live, don't touch",
    "made with 240 degrees of blue",
    "illusionary.exe is running",
  ];
  const quoteEl = document.getElementById('quote');
  let qi = 0;
  function rotateQuote(){
    quoteEl.style.opacity = 0;
    setTimeout(()=>{
      qi = (qi+1) % quotes.length;
      quoteEl.textContent = quotes[qi];
      quoteEl.style.opacity = 1;
    }, 400);
  }
  quoteEl.textContent = quotes[0];
  setInterval(rotateQuote, 7000);

  // ---------- drawer ----------
  const drawer = document.getElementById('drawer');
  const drawerToggle = document.getElementById('drawerToggle');
  const dockBarTrigger = document.getElementById('dockBarTrigger');
  const drawerClose = document.getElementById('drawerClose');

  function openDrawer(){
    drawer.classList.add('open');
    drawerToggle.classList.add('open');
  }
  function closeDrawer(){
    drawer.classList.remove('open');
    drawerToggle.classList.remove('open');
  }
  drawerToggle.addEventListener('click', ()=>{
    drawer.classList.contains('open') ? closeDrawer() : openDrawer();
  });
  dockBarTrigger.addEventListener('click', openDrawer);
  drawerClose.addEventListener('click', closeDrawer);

  // ---------- toast ----------
  const toastEl = document.getElementById('toast');
  let toastTimer = null;
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }

  // ---------- app tiles ----------
  document.querySelectorAll('.app-tile').forEach(tile=>{
    tile.addEventListener('click', ()=>{
      const app = tile.dataset.app;
      if(tile.classList.contains('soon')){
        showToast(app + ' — coming soon');
        return;
      }
      if(app === 'notes'){
        openFile('scratch', 'quick note');
      }
      if(app === 'storage'){
        openStorage();
      }
      if(app === 'calculator'){
        openCalculator();
      }
      if(app === 'timer'){
        openTimer();
      }
      if(app === 'rng'){
        openRng();
      }
      if(app === 'games'){
        openGames();
      }
    });
  });

  // ---------- file system ----------
  // index: illusionary-os:files-index -> [{id, name, updatedAt}]
  // content: illusionary-os:file:<id> -> raw text

  const INDEX_KEY = 'illusionary-os:files-index';
  const fileKey = id => 'illusionary-os:file:' + id;

  async function loadIndex(){
    try{
      const result = await window.storage.get(INDEX_KEY, false);
      return result ? JSON.parse(result.value) : [];
    }catch(e){
      return [];
    }
  }

  async function saveIndex(list){
    try{
      await window.storage.set(INDEX_KEY, JSON.stringify(list), false);
    }catch(e){ /* best effort */ }
  }

  async function touchIndexEntry(id, name){
    const list = await loadIndex();
    const existing = list.find(f => f.id === id);
    const now = Date.now();
    if(existing){
      existing.updatedAt = now;
      if(name) existing.name = name;
    }else{
      list.push({ id, name: name || id, updatedAt: now });
    }
    await saveIndex(list);
  }

  async function removeIndexEntry(id){
    const list = await loadIndex();
    await saveIndex(list.filter(f => f.id !== id));
  }

  function formatUpdated(ts){
    if(!ts) return 'never saved';
    const d = new Date(ts);
    return 'edited ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ' // ' + months[d.getMonth()] + ' ' + d.getDate();
  }

  // ---------- shared editor (notes app window) ----------
  const notesWindow = document.getElementById('notesWindow');
  const notesArea = document.getElementById('notesArea');
  const notesStatus = document.getElementById('notesStatus');
  const notesTitle = document.getElementById('notesTitle');
  let currentFileId = null;

  async function openFile(id, displayName){
    closeDrawer();
    currentFileId = id;
    notesTitle.textContent = displayName || id;
    notesWindow.classList.add('open');
    notesStatus.textContent = 'loading...';
    try{
      const result = await window.storage.get(fileKey(id), false);
      notesArea.value = result ? result.value : '';
      notesStatus.textContent = result ? 'loaded saved file' : 'new, unsaved file';
    }catch(e){
      notesArea.value = '';
      notesStatus.textContent = 'new, unsaved file';
    }
    notesArea.focus();
  }

  document.getElementById('notesClose').addEventListener('click', ()=>{
    notesWindow.classList.remove('open');
    currentFileId = null;
  });

  document.getElementById('notesSave').addEventListener('click', async ()=>{
    if(!currentFileId) return;
    notesStatus.textContent = 'saving...';
    try{
      const result = await window.storage.set(fileKey(currentFileId), notesArea.value, false);
      await touchIndexEntry(currentFileId, notesTitle.textContent);
      notesStatus.textContent = result ? 'saved just now' : 'save failed, try again';
    }catch(e){
      notesStatus.textContent = 'save failed, try again';
    }
  });

  // ---------- storage browser ----------
  const storageWindow = document.getElementById('storageWindow');
  const fileListEl = document.getElementById('fileList');
  const newFileName = document.getElementById('newFileName');

  function fileIconSvg(){
    return '<svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z" stroke-linejoin="round"/><path d="M8 9h8M8 13h8M8 17h4"/></svg>';
  }

  async function renderFileList(){
    const list = await loadIndex();
    list.sort((a,b) => (b.updatedAt||0) - (a.updatedAt||0));
    if(list.length === 0){
      fileListEl.innerHTML = '<div class="file-list-empty">no files yet — create one above</div>';
      return;
    }
    fileListEl.innerHTML = '';
    list.forEach(f => {
      const row = document.createElement('div');
      row.className = 'file-row';
      row.innerHTML = `
        <span class="file-icon">${fileIconSvg()}</span>
        <span class="file-meta">
          <div class="file-name"></div>
          <div class="file-updated"></div>
        </span>
        <button class="file-delete" aria-label="delete">×</button>
      `;
      row.querySelector('.file-name').textContent = f.name;
      row.querySelector('.file-updated').textContent = formatUpdated(f.updatedAt);
      row.querySelector('.file-meta').addEventListener('click', ()=> openFile(f.id, f.name));
      row.querySelector('.file-icon').addEventListener('click', ()=> openFile(f.id, f.name));
      row.querySelector('.file-delete').addEventListener('click', async (e)=>{
        e.stopPropagation();
        try{
          await window.storage.delete(fileKey(f.id), false);
        }catch(err){ /* key may already be gone */ }
        await removeIndexEntry(f.id);
        showToast('deleted ' + f.name);
        renderFileList();
      });
      fileListEl.appendChild(row);
    });
  }

  async function openStorage(){
    closeDrawer();
    storageWindow.classList.add('open');
    newFileName.value = '';
    fileListEl.innerHTML = '<div class="file-list-empty">loading...</div>';
    renderFileList();
  }

  document.getElementById('storageClose').addEventListener('click', ()=>{
    storageWindow.classList.remove('open');
  });

  async function createNewFile(){
    const name = newFileName.value.trim();
    if(!name) return;
    const id = 'f' + Date.now();
    try{
      await window.storage.set(fileKey(id), '', false);
    }catch(e){ /* best effort */ }

  // ---------- calculator ----------
  const calcWindow = document.getElementById('calcWindow');
  const calcPrev = document.getElementById('calcPrev');
  const calcCurrent = document.getElementById('calcCurrent');

  let calcAcc = null;      // stored left-hand value
  let calcOp = null;       // pending operator
  let calcEntry = '0';     // current on-screen entry
  let calcFresh = true;    // next digit press starts a new entry

  function openCalculator(){
    closeDrawer();
    calcWindow.classList.add('open');
    calcReset();
  }
  document.getElementById('calcClose').addEventListener('click', ()=>{
    calcWindow.classList.remove('open');
  });

  function calcReset(){
    calcAcc = null;
    calcOp = null;
    calcEntry = '0';
    calcFresh = true;
    calcPrev.innerHTML = '&nbsp;';
    calcCurrent.textContent = '0';
  }

  function calcRender(){
    calcCurrent.textContent = calcEntry;
    calcPrev.textContent = (calcAcc !== null && calcOp) ? formatNum(calcAcc) + ' ' + opSymbol(calcOp) : '\u00a0';
  }

  function opSymbol(op){
    return { add:'+', subtract:'\u2212', multiply:'\u00d7', divide:'\u00f7' }[op] || '';
  }

  function formatNum(n){
    if(!isFinite(n)) return 'error';
    const rounded = Math.round(n * 1e10) / 1e10;
    return rounded.toString();
  }

  function calcApply(a, b, op){
    switch(op){
      case 'add': return a + b;
      case 'subtract': return a - b;
      case 'multiply': return a * b;
      case 'divide': return b === 0 ? NaN : a / b;
      default: return b;
    }
  }

  function calcPressDigit(d){
    if(calcFresh){
      calcEntry = (d === '.') ? '0.' : d;
      calcFresh = false;
    }else{
      if(d === '.' && calcEntry.includes('.')) return;
      calcEntry = (calcEntry === '0' && d !== '.') ? d : calcEntry + d;
    }
    calcRender();
  }

  function calcPressOp(op){
    const val = parseFloat(calcEntry);
    if(calcAcc !== null && calcOp && !calcFresh){
      calcAcc = calcApply(calcAcc, val, calcOp);
    }else{
      calcAcc = val;
    }
    calcOp = op;
    calcFresh = true;
    calcEntry = formatNum(calcAcc);
    calcRender();
  }

  function calcEquals(){
    if(calcOp === null) return;
    const val = parseFloat(calcEntry);
    const result = calcApply(calcAcc, val, calcOp);
    calcEntry = formatNum(result);
    calcAcc = null;
    calcOp = null;
    calcFresh = true;
    calcPrev.innerHTML = '&nbsp;';
    calcCurrent.textContent = calcEntry;
  }

  document.querySelectorAll('.calc-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      if(/^[0-9]$/.test(key)) return calcPressDigit(key);
      switch(key){
        case 'decimal': return calcPressDigit('.');
        case 'clear': return calcReset();
        case 'sign':
          calcEntry = formatNum(parseFloat(calcEntry) * -1);
          return calcRender();
        case 'percent':
          calcEntry = formatNum(parseFloat(calcEntry) / 100);
          return calcRender();
        case 'sqrt':
          calcEntry = formatNum(Math.sqrt(parseFloat(calcEntry)));
          calcFresh = true;
          return calcRender();
        case 'square':
          calcEntry = formatNum(Math.pow(parseFloat(calcEntry), 2));
          calcFresh = true;
          return calcRender();
        case 'reciprocal':
          calcEntry = formatNum(1 / parseFloat(calcEntry));
          calcFresh = true;
          return calcRender();
        case 'backspace':
          if(calcFresh) return;
          calcEntry = calcEntry.length > 1 ? calcEntry.slice(0, -1) : '0';
          if(calcEntry === '-') calcEntry = '0';
          return calcRender();
        case 'add': case 'subtract': case 'multiply': case 'divide':
          return calcPressOp(key);
        case 'equals':
          return calcEquals();
      }
    });
  });

  // ================= SNAKE =================
  const snakeCanvas = document.getElementById('snakeCanvas');
  const snakeCtx = snakeCanvas.getContext('2d');
  const snakeGridSelect = document.getElementById('snakeGridSelect');
  const snakeSpeedSelect = document.getElementById('snakeSpeedSelect');
  let SNAKE_GRID = 15;
  let SNAKE_CELL = snakeCanvas.width / SNAKE_GRID;
  const snakeScoreEl = document.getElementById('snakeScore');
  const snakeOverlay = document.getElementById('snakeOverlay');
  let snakeBody, snakeDir, snakeNextDir, snakeFood, snakeAlive, snakeScore, snakeLoopId;

  function snakeRandCell(){
    return { x: Math.floor(Math.random()*SNAKE_GRID), y: Math.floor(Math.random()*SNAKE_GRID) };
  }

  function snakeStart(){
    SNAKE_GRID = parseInt(snakeGridSelect.value, 10);
    SNAKE_CELL = snakeCanvas.width / SNAKE_GRID;
    const speed = parseFloat(snakeSpeedSelect.value);
    const tickMs = Math.round(1000 / speed);

    const mid = Math.floor(SNAKE_GRID/2);
    snakeBody = [{x:mid,y:mid},{x:mid-1,y:mid},{x:mid-2,y:mid}];
    snakeDir = 'right';
    snakeNextDir = 'right';
    snakeFood = snakeRandCell();
    snakeAlive = true;
    snakeScore = 0;
    snakeScoreEl.textContent = 'score: 0';
    snakeOverlay.innerHTML = '&nbsp;';
    clearInterval(snakeLoopId);
    snakeLoopId = setInterval(snakeTick, tickMs);

  function snakeTick(){
    if(!snakeAlive) return;
    const opposite = { up:'down', down:'up', left:'right', right:'left' };
    if(snakeNextDir !== opposite[snakeDir]) snakeDir = snakeNextDir;

    const head = { ...snakeBody[0] };
    if(snakeDir === 'up') head.y--;
    if(snakeDir === 'down') head.y++;
    if(snakeDir === 'left') head.x--;
    if(snakeDir === 'right') head.x++;

    const hitWall = head.x < 0 || head.y < 0 || head.x >= SNAKE_GRID || head.y >= SNAKE_GRID;
    const hitSelf = snakeBody.some(seg => seg.x === head.x && seg.y === head.y);
    if(hitWall || hitSelf){
      snakeAlive = false;
      snakeOverlay.textContent = 'game over — tap restart';
      snakeDraw();
      return;
    }

    snakeBody.unshift(head);
    if(head.x === snakeFood.x && head.y === snakeFood.y){
      snakeScore++;
      snakeScoreEl.textContent = 'score: ' + snakeScore;
      let f;
      do { f = snakeRandCell(); } while(snakeBody.some(s => s.x===f.x && s.y===f.y));
      snakeFood = f;
    }else{
      snakeBody.pop();
    }
    snakeDraw();
  }

  function snakeDraw(){
    snakeCtx.clearRect(0,0,snakeCanvas.width,snakeCanvas.height);
    snakeCtx.fillStyle = '#0000ff';
    snakeCtx.fillRect(snakeFood.x*SNAKE_CELL+3, snakeFood.y*SNAKE_CELL+3, SNAKE_CELL-6, SNAKE_CELL-6);
    snakeBody.forEach((seg, i)=>{
      snakeCtx.strokeStyle = '#1414e0';
      snakeCtx.lineWidth = 2.5;
      snakeCtx.fillStyle = i === 0 ? '#1414e0' : '#c7c7ff';
      snakeCtx.fillRect(seg.x*SNAKE_CELL+1, seg.y*SNAKE_CELL+1, SNAKE_CELL-2, SNAKE_CELL-2);
      snakeCtx.strokeRect(seg.x*SNAKE_CELL+1, seg.y*SNAKE_CELL+1, SNAKE_CELL-2, SNAKE_CELL-2);
    });
  }

  const G2048_SHADES = {
    2:'var(--peri-100)', 4:'var(--peri-200)', 8:'var(--peri-300)', 16:'var(--peri-400)',
    32:'var(--blue-500)', 64:'var(--blue-600)', 128:'var(--blue-600)', 256:'var(--blue-700)',
    512:'var(--blue-700)', 1024:'var(--blue-900)', 2048:'var(--blue-900)'

  function g2048SpawnTile(){
    const occupied = new Set(g2048Tiles.map(t => t.row + ',' + t.col));
    const empty = [];
    for(let r=0;r<4;r++) for(let c=0;c<4;c++){
      if(!occupied.has(r + ',' + c)) empty.push({row:r, col:c});
    }
    if(empty.length === 0) return;
    const pos = empty[Math.floor(Math.random()*empty.length)];
    g2048NextId++;
    g2048Tiles.push({ id: g2048NextId, value: Math.random() < 0.9 ? 2 : 4, row: pos.row, col: pos.col });
  }

  function g2048Layout(popIds){
    const cellSize = g2048CellSize();
    const step = cellSize + G2048_GAP;
    const liveIds = new Set(g2048Tiles.map(t => t.id));

    Object.keys(g2048TileEls).forEach(id => {
      if(!liveIds.has(Number(id))){
        g2048TileEls[id].remove();
        delete g2048TileEls[id];
      }
    });

    g2048Tiles.forEach(t => {
      let wrap = g2048TileEls[t.id];
      let isNew = false;
      if(!wrap){
        isNew = true;
        wrap = document.createElement('div');
        wrap.className = 'g2048-tile-wrap';
        const inner = document.createElement('div');
        inner.className = 'g2048-tile-inner';
        wrap.appendChild(inner);
        g2048TilesLayerEl.appendChild(wrap);
        g2048TileEls[t.id] = wrap;
      }
      wrap.style.width = cellSize + 'px';
      wrap.style.height = cellSize + 'px';

      if(isNew){
        wrap.style.transition = 'none';
        wrap.style.transform = `translate(${t.col*step}px, ${t.row*step}px)`;
        void wrap.offsetWidth;
        wrap.style.transition = '';
      }else{
        wrap.style.transform = `translate(${t.col*step}px, ${t.row*step}px)`;
      }

      const inner = wrap.firstChild;
      inner.textContent = t.value;
      inner.style.background = G2048_SHADES[t.value] || 'var(--blue-900)';
      inner.style.color = t.value >= 32 ? 'var(--white)' : 'var(--blue-900)';

      if(isNew || popIds.includes(t.id)){
        inner.classList.remove('pop');
        void inner.offsetWidth;
        inner.classList.add('pop');
      }
    });
  }

  function g2048BuildLines(dir){
    const lines = [];
    if(dir === 'left'){
      for(let r=0;r<4;r++) lines.push([0,1,2,3].map(c => ({row:r, col:c})));
    }else if(dir === 'right'){
      for(let r=0;r<4;r++) lines.push([3,2,1,0].map(c => ({row:r, col:c})));
    }else if(dir === 'up'){
      for(let c=0;c<4;c++) lines.push([0,1,2,3].map(r => ({row:r, col:c})));
    }else if(dir === 'down'){
      for(let c=0;c<4;c++) lines.push([3,2,1,0].map(r => ({row:r, col:c})));
    }
    return lines;
  }

  function g2048Move(dir){
    if(g2048Over) return;
    let moved = false;
    let gained = 0;
    const toRemove = [];
    const mergedIds = [];

    g2048BuildLines(dir).forEach(line => {
      const tilesInLine = line
        .map(pos => g2048Tiles.find(t => t.row === pos.row && t.col === pos.col))
        .filter(Boolean);

      let slotIndex = 0;
      let lastPlaced = null;

      tilesInLine.forEach(tile => {
        if(lastPlaced && lastPlaced.value === tile.value && !lastPlaced._merged){
          const dest = line[slotIndex - 1];
          if(tile.row !== dest.row || tile.col !== dest.col) moved = true;
          tile.row = dest.row; tile.col = dest.col;
          lastPlaced.value *= 2;
          lastPlaced._merged = true;
          gained += lastPlaced.value;
          mergedIds.push(lastPlaced.id);
          toRemove.push(tile);
        }else{
          const dest = line[slotIndex];
          if(tile.row !== dest.row || tile.col !== dest.col) moved = true;
          tile.row = dest.row; tile.col = dest.col;
          slotIndex++;
          lastPlaced = tile;
        }
      });
    });

    if(!moved) return;

    g2048Score += gained;
    g2048ScoreEl.textContent = 'score: ' + g2048Score;
    g2048Layout([]);

    setTimeout(()=>{
      g2048Tiles = g2048Tiles.filter(t => !toRemove.includes(t));
      g2048Tiles.forEach(t => { delete t._merged; });
      g2048SpawnTile();
      g2048Layout(mergedIds);
      g2048CheckEnd();
    }, 160);
  }

  function g2048CheckEnd(){
    const grid = Array.from({length:4}, () => [0,0,0,0]);
    g2048Tiles.forEach(t => { grid[t.row][t.col] = t.value; });
    const flat = grid.flat();
    if(flat.includes(2048)){
      g2048Over = true;
      g2048Overlay.textContent = '2048! you win — restart to play again';
      return;
    }
    if(flat.includes(0)) return;
    for(let r=0;r<4;r++) for(let c=0;c<3;c++){
      if(grid[r][c] === grid[r][c+1]) return;
      if(grid[c][r] === grid[c+1][r]) return;
    }
    g2048Over = true;
    g2048Overlay.textContent = 'no more moves — game over';
  }

  // ================= MINESWEEPER =================
  const minesBoardEl = document.getElementById('minesBoard');
  const minesCountEl = document.getElementById('minesCount');
  const minesOverlay = document.getElementById('minesOverlay');
  const minesFlagBtn = document.getElementById('minesFlagMode');
  const minesDifficultySelect = document.getElementById('minesDifficulty');
  const MINES_PRESETS = {
    easy:   { size: 8,  count: 10 },
    medium: { size: 12, count: 25 },
    hard:   { size: 20, count: 75 },
  };
  let MINES_SIZE = 8;
  let MINES_COUNT = 10;
  let minesGrid, minesRevealedCount, minesOver, minesFlagMode;

  function minesStart(){
    const preset = MINES_PRESETS[minesDifficultySelect.value];
    MINES_SIZE = preset.size;
    MINES_COUNT = preset.count;
    minesBoardEl.style.setProperty('--cell', Math.max(14, Math.min(32, Math.floor(360 / MINES_SIZE))) + 'px');

    minesFlagMode = false;
    minesFlagBtn.textContent = 'flag mode: off';
    minesOver = false;
    minesRevealedCount = 0;
    minesOverlay.innerHTML = '&nbsp;';
    minesCountEl.textContent = 'mines: ' + MINES_COUNT;

    minesGrid = Array.from({length:MINES_SIZE}, () =>
      Array.from({length:MINES_SIZE}, () => ({ mine:false, revealed:false, flagged:false, count:0 }))
    );
    let placed = 0;
    while(placed < MINES_COUNT){
      const r = Math.floor(Math.random()*MINES_SIZE);
      const c = Math.floor(Math.random()*MINES_SIZE);
      if(!minesGrid[r][c].mine){ minesGrid[r][c].mine = true; placed++; }
    }
    for(let r=0;r<MINES_SIZE;r++) for(let c=0;c<MINES_SIZE;c++){
      if(minesGrid[r][c].mine) continue;
      let n = 0;
      for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
        const rr=r+dr, cc=c+dc;
        if(rr>=0 && rr<MINES_SIZE && cc>=0 && cc<MINES_SIZE && minesGrid[rr][cc].mine) n++;
      }
      minesGrid[r][c].count = n;
    }
    minesRender();
  }
  document.getElementById('minesRestart').addEventListener('click', minesStart);
  minesDifficultySelect.addEventListener('change', minesStart);
  minesFlagBtn.addEventListener('click', ()=>{
    minesFlagMode = !minesFlagMode;
    minesFlagBtn.textContent = 'flag mode: ' + (minesFlagMode ? 'on' : 'off');
  });

  function minesReveal(r, c){
    const cell = minesGrid[r][c];
    if(cell.revealed || cell.flagged) return;
    cell.revealed = true;
    minesRevealedCount++;
    if(cell.mine){
      minesOver = true;
      minesGrid.forEach(row => row.forEach(cc => { if(cc.mine) cc.revealed = true; }));
      minesOverlay.textContent = 'boom — tap restart';
      minesRender();
      return;
    }
    if(cell.count === 0){
      for(let dr=-1; dr<=1; dr++) for(let dc=-1; dc<=1; dc++){
        const rr=r+dr, cc2=c+dc;
        if(rr>=0 && rr<MINES_SIZE && cc2>=0 && cc2<MINES_SIZE && !minesGrid[rr][cc2].revealed){
          minesReveal(rr, cc2);
        }
      }
    }
    const total = MINES_SIZE*MINES_SIZE;
    if(minesRevealedCount === total - MINES_COUNT){
      minesOver = true;
      minesOverlay.textContent = 'cleared! tap restart to play again';
    }
  }

  function minesRender(){
    minesBoardEl.style.gridTemplateColumns = `repeat(${MINES_SIZE}, var(--cell))`;
    minesBoardEl.innerHTML = '';
    for(let r=0;r<MINES_SIZE;r++) for(let c=0;c<MINES_SIZE;c++){
      const cell = minesGrid[r][c];
      const div = document.createElement('div');
      div.className = 'mine-cell' + (cell.revealed ? ' revealed' : '') + (cell.flagged ? ' flagged' : '') + (cell.revealed && cell.mine ? ' mine' : '');
      if(cell.revealed && cell.mine) div.textContent = '*';
      else if(cell.revealed && cell.count > 0) div.textContent = cell.count;
      else if(cell.flagged) div.textContent = '⚑';
      div.addEventListener('click', ()=>{
        if(minesOver) return;
        if(minesFlagMode){
          if(!cell.revealed){ cell.flagged = !cell.flagged; minesRender(); }
        }else{
          minesReveal(r, c);
          minesRender();
        }
      });
      div.addEventListener('contextmenu', (e)=>{
        e.preventDefault();
        if(minesOver || cell.revealed) return;
        cell.flagged = !cell.flagged;
        minesRender();
      });
      minesBoardEl.appendChild(div);
    }
  }
</script>

</body>
</html>
